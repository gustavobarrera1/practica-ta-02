name: Deploy to Amazon ECS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
  push:
    paths:
      - "app/**" 

permissions:
  id-token: write
  contents: read
  deployments: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: flask_app_repository
  ECS_CLUSTER: ecs-workshop                 # Nombre de tu clúster según Terraform
  ECS_SERVICE: flask-service                # El nombre que le daremos al servicio en ECS
  ECS_TASK_DEFINITION: .aws/task-definition.json # Archivo que debe estar en la raíz del repo
  CONTAINER_NAME: flaskapp                  # Debe coincidir exactamente con el task-definition

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: 3.8

    - name: Install dependencies
      working-directory: app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Inyectar Execution Role ARN
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        sed -i "s|EXECUTION_ROLE_ARN_PLACEHOLDER|arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole|g" ${{ env.ECS_TASK_DEFINITION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        format: 'table'
        severity: 'CRITICAL,HIGH'
        # exit-code: '1'

    - name: Push image to Amazon ECR
      id: push-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Inyectar nueva imagen en la Task Definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.push-image.outputs.image }}

    - name: Desplegar en Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true