name: Terraform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_VAR_ecs_task_def_memory: ${{ vars.ECS_TASK_DEF_MEMORY }}
      TF_VAR_ecs_task_def_cpu: ${{ vars.ECS_TASK_DEF_CPU }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan

      - name: Apply
        run: terraform apply -auto-approve